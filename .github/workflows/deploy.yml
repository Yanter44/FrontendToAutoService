name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Загружаем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Очищаем папку на сервере
      - name: Clean server directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            sudo rm -rf /var/www/toautoserviceproject/*
            sudo mkdir -p /var/www/toautoserviceproject

      # 3. Копируем ВСЕ файлы из корня репозитория
      - name: Copy all contents to server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "." 
          target: "/var/www/toautoserviceproject"
          strip_components: 0 
          overwrite: true

      # 4. Устанавливаем права
      - name: Set permissions for frontend
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            sudo chown -R www-data:www-data /var/www/toautoserviceproject
            sudo chmod -R 755 /var/www/toautoserviceproject
